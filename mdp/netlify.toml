# Netlify site for the new MDP app: set the site's base directory to "mdp".
[build]
  command = "npm ci && npm run build"
  publish = "out"

# Updates must land immediately: never cache the pages or the service worker.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
