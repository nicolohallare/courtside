<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MDP Kitchen Sense</title>
<meta name="description" content="Match Day Pickle's strategy game. Call the shot, then let the coach tell you why you lost the point.">
<meta name="theme-color" content="#0d1b2a">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/mdp-logo.webp">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>html,body{margin:0;height:100%}[hidden]{display:none!important}#app{padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}</style>
</head>
<body>
<!-- MDP Kitchen Sense: a hidden strategy game. Opened from the app by tapping the header logo 5 times.
     Reads ?dupr=<rating> and ?name=<first name> from the app. Static file: no build step, no app data. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
/* Layout: a Match Day Pickle night match seen from a broadcast camera; a scorebug and controls sit on dark glass over the court; menus rise as a bottom sheet. */
:root{
  --night:#0B1622; --navy:#0D1B2A; --panel:rgba(13,27,42,.9); --panel2:#13263A; --edge:rgba(245,237,224,.14);
  --text:#F5EDE0; --dim:#A99F8C; --volt:#E0357A; --gold:#C9A84C; --blue:#C9A84C; --red:#33465E; --court:#2D6A4F;
  --display:"Bricolage Grotesque","Arial Black",Arial,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark; background:var(--night);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--body);font-weight:500;overflow:hidden;overscroll-behavior:none;touch-action:none}
#app{position:relative;height:100%;overflow:hidden}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 58%,transparent 42%,rgba(3,5,18,.78) 100%)}
#hud{position:absolute;top:10px;left:0;right:0;padding-left:var(--gl);padding-right:var(--gr);display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
#bug{background:var(--panel);border:1px solid var(--edge);border-radius:10px;overflow:hidden;font-family:var(--display);min-width:0;flex:0 1 auto;backdrop-filter:blur(6px)}
#bug .t{white-space:nowrap;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:4px 10px 3px;font-weight:600}
#bug .r{display:flex;align-items:center;gap:8px;padding:3px 10px;font-size:16px;font-weight:700;letter-spacing:0;border-top:1px solid var(--edge)}
#bug .r i{width:6px;height:6px;border-radius:50%;background:transparent;flex:0 0 auto}
#bug .r.sv i{background:var(--gold)}
#bug .r span{flex:1;white-space:nowrap}
#bug .r b{font-size:22px;font-variant-numeric:tabular-nums;color:var(--gold);min-width:22px;text-align:right}
.hud-r{display:flex;gap:8px;pointer-events:auto}
.icon{height:36px;min-width:36px;padding:0 9px;border-radius:10px;border:1px solid var(--edge);background:var(--panel);color:var(--text);font:700 13px var(--display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(6px)}
.icon.on{background:var(--volt);color:#fff;border-color:var(--volt)}
.icon.off{opacity:.5}
.mlogo{width:58px;height:58px;object-fit:contain;flex:0 0 auto;margin:-4px 0 0 -4px}
.mhead{display:flex;gap:10px;align-items:center}
.mhead div{min-width:0}
#toast{position:absolute;top:22%;left:0;right:0;text-align:center;pointer-events:none}
#toast span{display:inline-block;font:800 30px var(--display);letter-spacing:-.01em;color:var(--text);text-shadow:0 2px 0 #000,0 0 18px rgba(0,0,0,.6);opacity:0;transform:translateY(8px);transition:opacity .15s,transform .15s}
#toast span.on{opacity:1;transform:none}
#splash{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none}
#splash b{display:block;font:800 clamp(48px,14vw,88px)/.9 var(--display);letter-spacing:-.02em;color:var(--volt);text-shadow:0 4px 0 #05070F,0 0 40px rgba(0,0,0,.55);animation:slam .42s cubic-bezier(.2,1.4,.4,1) both}
#splash.lose b{color:var(--text)}
#splash span{display:inline-block;margin-top:10px;background:var(--panel);border:1px solid var(--edge);border-radius:99px;padding:3px 14px;font:700 15px var(--body);letter-spacing:.02em;animation:slam .42s .08s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slam{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
.lab{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;will-change:transform}
.bub{background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:2px 9px 3px;font:600 13px var(--body);color:var(--text)}
.tag{background:var(--gold);color:var(--navy);border-radius:99px;padding:2px 10px 3px;font:700 13px var(--body);letter-spacing:.02em}
.call{background:var(--volt);color:#fff;border-radius:99px;padding:3px 14px 4px;font:800 16px var(--display);letter-spacing:0;box-shadow:0 0 18px rgba(224,53,122,.55)}
#deck{position:absolute;left:0;right:0;bottom:0;padding:8px var(--gr) 10px var(--gl);pointer-events:none}
#deck .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
#msg{min-height:19px;text-align:center;font:600 14px var(--body);color:var(--text);text-shadow:0 1px 3px #000}
#heard{align-self:center;background:var(--panel);border:1px solid var(--edge);border-radius:999px;padding:2px 12px;font:600 12px var(--body);color:var(--dim)}
.rowb{display:flex;gap:6px;pointer-events:auto}
.rowb button{flex:1;min-width:0;border:1px solid var(--edge);background:var(--panel);color:var(--text);border-radius:14px;cursor:pointer;backdrop-filter:blur(6px);font-family:var(--display);letter-spacing:-.01em}
.aim button{padding:7px 4px;font-size:14px;font-weight:600;color:var(--dim)}
.aim button.on{color:var(--navy);background:var(--text);border-color:var(--text)}
.shots button{padding:12px 4px 13px;font-size:20px;font-weight:800}
.shots button small{display:block;font:500 10.5px var(--body);letter-spacing:.02em;text-transform:none;color:var(--dim);font-style:normal;margin-top:1px}
.shots button:active,.shots button.hit{background:var(--volt);color:#fff;border-color:var(--volt)}
.shots button:active small,.shots button.hit small{color:#fff}
#serve-row button{background:var(--volt);color:#fff;border-color:var(--volt)}
#serve-row button small{color:rgba(255,255,255,.85)}
button:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
#overlay{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;padding:12px var(--gr) 12px var(--gl)}
#overlay.show{display:flex}
#overlay.dimmed{background:rgba(3,5,18,.5)}
.card{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:18px 18px 16px;backdrop-filter:blur(10px);animation:rise .26s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{transform:translateY(36px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card,#splash b,#splash span{animation:none}#toast span{transition:none}}
h1{font:800 44px/.95 var(--display);margin:0 0 6px;letter-spacing:-.025em;text-wrap:balance}
h1 em{font-style:normal;color:var(--volt)}
.kick{display:flex;align-items:center;gap:8px;font:700 13px var(--body);color:var(--gold);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
.kick b{background:var(--volt);color:#fff;border-radius:99px;padding:2px 9px;letter-spacing:.04em}
.site{font-size:13.5px;color:var(--dim);margin:12px 0 0}.site a{color:var(--text);font-weight:700;text-decoration-color:var(--volt);text-underline-offset:3px}
h2{font:800 30px/1 var(--display);margin:0 0 8px;letter-spacing:-.02em;text-wrap:balance}
p{margin:0 0 10px;font-size:15px;line-height:1.45}
p.dim{color:var(--dim);font-size:13.5px}
.lbl{font:700 12px var(--body);color:var(--dim);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.16em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--edge);background:var(--panel2);border-radius:9px;padding:7px 11px;font:600 14px var(--body);color:var(--text);cursor:pointer;font-variant-numeric:tabular-nums}
.chip small{font-weight:500;color:var(--dim);font-size:12px;margin-left:5px}
.chip.on{border-color:var(--volt);background:rgba(224,53,122,.2)}
.row{display:flex;gap:8px;margin-top:14px}
button.big{flex:1;min-width:0;white-space:nowrap;font:800 19px var(--display);letter-spacing:-.01em;color:#fff;background:var(--volt);border:0;border-radius:14px;padding:12px 10px 13px;cursor:pointer}
button.big.alt{background:var(--gold);color:var(--navy)}
button.big.soft{background:var(--panel2);color:var(--text);border:1px solid var(--edge)}
button.big:active{transform:translateY(2px);filter:brightness(.9)}
.verdict{display:inline-block;border-radius:99px;padding:2px 14px 3px;font:800 17px var(--display);letter-spacing:-.01em;margin-bottom:8px;color:#fff;background:var(--volt)}
.verdict.lose{background:var(--red);color:var(--text)}
.coach{border-left:3px solid var(--gold);padding:2px 0 2px 12px;margin-top:4px}
.coach p{font-size:14.5px;margin:0 0 8px}.coach p:last-child{margin:0}
.log{font-size:13px;color:var(--dim);margin-top:12px}
.log div{padding:5px 0;border-top:1px solid var(--edge)}.log b{color:var(--text);font-weight:600}
#fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--night);font-size:16px}
</style>

<div id="app">
  <canvas id="c"></canvas>
  <div id="vig"></div>
  <div id="labels"></div>
  <div id="hud">
    <div id="bug"><div class="t" id="bug-t">Match Day Pickle!</div><div id="bug-rows"></div></div>
    <div class="hud-r"><button class="icon" id="b-mic" hidden aria-label="Voice calling on or off">Mic</button><button class="icon" id="b-mute" aria-label="Sound on or off">Sound</button><button class="icon" id="b-exit" aria-label="Back to the MDP app">Exit</button></div>
  </div>
  <div id="toast"><span id="toast-s"></span></div>
  <div id="splash" hidden><b></b><span></span></div>
  <div id="deck" hidden><div class="in">
    <div id="heard" hidden></div>
    <div id="msg"></div>
    <div class="rowb aim" id="aim"><button id="aim-left" data-a="left">Left</button><button id="aim-middle" data-a="middle">Middle</button><button id="aim-right" data-a="right">Right</button></div>
    <div class="rowb shots" id="shots"><button id="s-soft" data-s="soft"><span id="s-soft-l">Dink</span><small>soft, in the kitchen</small></button><button id="s-drive" data-s="drive">Drive<small>hard and low</small></button><button id="s-lob" data-s="lob">Lob<small>over their heads</small></button><button id="s-smash" data-s="smash">Smash<small>high balls only</small></button></div>
    <div class="rowb shots" id="serve-row" hidden><button id="b-serve" data-s="serve">Serve<small>deep, to the box across from you</small></button></div>
  </div></div>
  <div id="overlay"></div>
  <div id="fail" hidden>The 3D court could not start on this device. Try reopening the page in Chrome or Safari.</div>
</div>

<script>
(function(){
  var srcs=['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'];
  function load(i){
    if(i>=srcs.length){document.getElementById('fail').hidden=false;return;}
    var s=document.createElement('script');s.src=srcs[i];
    s.onload=function(){var lg=new Image();lg.src='/mdp-logo.webp';window.__logo=lg;var done=false,once=function(){if(done)return;done=true;try{window.__boot()}catch(e){console.error(e);document.getElementById('fail').hidden=false}};
      var logoP=new Promise(function(r){lg.onload=r;lg.onerror=r;if(lg.complete)r();});try{Promise.all([document.fonts.load('800 40px "Bricolage Grotesque"'),document.fonts.load('700 16px "DM Sans"'),logoP]).then(once,once);}catch(e){}setTimeout(once,2000);};
    s.onerror=function(){load(i+1)};document.head.appendChild(s);
  }
  window.__loadThree=function(){load(0)};
})();
</script>
<script>
window.__boot=function(){
const T=THREE;
const APP_HOME='/',LOGO=window.__logo;const hasLogo=()=>LOGO&&LOGO.complete&&LOGO.naturalWidth>0;
const QS=new URLSearchParams(location.search),QNAME=(QS.get('name')||'').replace(/[^\p{L}\p{N} .'-]/gu,'').trim().slice(0,14);
const TEAM=(QNAME||'You')+' & Jo';
/* ================= tuning ================= */
const LEVELS=[2.5,3.0,3.5,4.0,4.5,5.0];
const OPP={2.5:{err:3.4,drop:.15,attack:.15,up:.3,spd:8.5,pop:.35},3.0:{err:2.6,drop:.35,attack:.28,up:.6,spd:10,pop:.25},
  3.5:{err:1.9,drop:.6,attack:.42,up:.85,spd:11.5,pop:.17},4.0:{err:1.4,drop:.75,attack:.6,up:.95,spd:12.5,pop:.11},
  4.5:{err:1.0,drop:.85,attack:.75,up:1,spd:13.5,pop:.07},5.0:{err:.7,drop:.9,attack:.88,up:1,spd:14.5,pop:.04}};
const MYERR={2.5:3.0,3.0:2.4,3.5:1.8,4.0:1.3,4.5:.9,5.0:.6};
const G=24,NETH=3.1,SMASH_Z=3.6;
/* ================= cast ================= */
const TEAMS={
 2.5:[{n:'Sunday Sam',skin:'#E9BE96',shirt:'#E8566D',short:'#2B3550',hair:'short',hc:'#7A4A2A',cap:'#F2F2F2',win:['Did I do that?','Ha.'],lose:['Ay, sorry.','Was that in?']},
      {n:'Aunt Deb',f:1,skin:'#DDAE86',shirt:'#9B7BEA',short:'#F2F2F2',hair:'curly',hc:'#D4D4D4',visor:'#F2F2F2',win:['Ay, salamat.','Ha.'],lose:['Naku.','Shoot.']}],
 3.0:[{n:'Riley',f:1,skin:'#8F5E38',shirt:'#F2C230',short:'#1B2233',hair:'pony',hc:'#1A1A1A',band:'#F2F2F2',win:['Boom.','Ayos.'],lose:['Ugh.','Again.']},
      {n:'Marco',skin:'#C99468',shirt:'#3FA9F0',short:'#F2F2F2',hair:'short',hc:'#1B1B1B',win:['Easy.','Whoa.'],lose:['My bad, pare.','Nooo.']}],
 3.5:[{n:'League Lou',skin:'#EFC9A6',shirt:'#6C3FD6',short:'#1B2233',hair:'bald',hc:'#5A4636',beard:1,win:['Textbook.','Kitchen.'],lose:['Reset, reset.','Hay.']},
      {n:'Nina',f:1,skin:'#8F5E38',shirt:'#22B8A6',short:'#F2F2F2',hair:'bun',hc:'#2B1B12',win:['Yes.','Feet.'],lose:['Napataas ko.','Argh.']}],
 4.0:[{n:'Tourney Tess',f:1,skin:'#E9BE96',shirt:'#E0405F',short:'#1B2233',hair:'pony',hc:'#B56A27',visor:'#F2F2F2',win:['Bang.','Next.'],lose:['Ang taas.','Fine.']},
      {n:'Dev',skin:'#B9804F',shirt:'#2F6BF0',short:'#F2F2F2',hair:'short',hc:'#111111',win:['Clean.','Got it.'],lose:['Adjust.','Hmph.']}],
 4.5:[{n:'Open Otis',skin:'#7A4A22',shirt:'#F08A1C',short:'#1B2233',hair:'buzz',hc:'#0A0A0A',band:'#F2F2F2',win:['Mm.','There.'],lose:['Mm.','Noted.']},
      {n:'Kim',f:1,skin:'#F0CBA8',shirt:'#27B865',short:'#F2F2F2',hair:'bob',hc:'#111111',win:['Patience.','There.'],lose:['Sloppy.','No.']}],
 5.0:[{n:'Pro Pat',skin:'#DDAE86',shirt:'#161B2A',short:'#161B2A',hair:'short',hc:'#E2E2E2',shades:1,accent:'#D8FF3D',win:['…','Ok.'],lose:['Lucky.','…']},
      {n:'Alex',f:1,skin:'#E9BE96',shirt:'#161B2A',short:'#D8FF3D',hair:'pony',hc:'#111111',shades:1,cap:'#161B2A',accent:'#D8FF3D',win:['Next.','Done.'],lose:['Again.','Hm.']}]};
const ME={n:'You',skin:'#E2B58C',shirt:'#E0357A',short:'#0D1B2A',hair:'short',hc:'#3B2A1A',accent:'#C9A84C',win:['Yes.','Laban.'],lose:['Sayang.','Next one.']};
const PARTNER={n:'Jo',f:1,skin:'#7A4A22',shirt:'#E0357A',short:'#0D1B2A',hair:'bun',hc:'#111111',accent:'#C9A84C',win:['Ganda nun.','Tara, next.'],lose:['Sayang.','Laban lang.']};

/* ================= state ================= */
const S={dupr:3.5,opp:3.5,mode:null,you:0,them:0,serving:true,ents:{},ball:null,phase:'idle',shotN:0,log:[],pending:null,aim:null,pts:0,last:0,slow:1,myHome:30,shake:0,cheer:0,menu:1,stop:0,focus:0,focusK:0,called:false};
try{const sv=JSON.parse(localStorage.getItem('ks-levels')||'null');if(sv&&LEVELS.includes(sv.dupr)&&LEVELS.includes(sv.opp)){S.dupr=sv.dupr;S.opp=sv.opp;}}catch(e){}
{const qd=parseFloat(QS.get('dupr'));if(qd>0){const lv=LEVELS.reduce((a,b)=>Math.abs(b-qd)<Math.abs(a-qd)?b:a);S.dupr=lv;S.opp=lv;}}
const $=s=>document.querySelector(s),rnd=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k,gauss=()=>(rnd()+rnd()+rnd()-1.5)*1.6;
const damp=(a,b,r,dt)=>lerp(a,b,1-Math.exp(-r*dt));
const overlay=$('#overlay'),deck=$('#deck'),cv=$('#c'),labels=$('#labels');
const toast=(t,ms=900)=>{const e=$('#toast-s');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),ms);};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function splash(text,sub,lose){const el=$('#splash');el.hidden=true;void el.offsetWidth;el.className=lose?'lose':'';el.querySelector('b').textContent=text;el.querySelector('span').textContent=sub;el.hidden=false;clearTimeout(splash.t);splash.t=setTimeout(()=>el.hidden=true,1550);}

/* ================= sound ================= */
let AC=null,muted=false,noiseBuf=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*1.5;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=rnd()*2-1;}catch(e){AC=null;}}if(AC&&AC.state==='suspended')AC.resume();}
function blip(f0,f1,dur,vol,type){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);}
function hiss(dur,vol,freq,q,attack){if(!AC||muted||!noiseBuf)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(vol,t+(attack||.005));g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur+.05);}
const sfx={hit(type){if(type==='soft'){blip(1250,820,.05,.22);hiss(.03,.12,3000,2);}else if(type==='lob'){blip(1000,560,.07,.3);hiss(.04,.18,2400,2);}else if(type==='smash'){blip(700,240,.1,.5,'square');hiss(.08,.4,1800,1.2);}else{blip(880,380,.08,.42,'square');hiss(.05,.3,2200,1.5);}},
  bounce(){blip(480,260,.06,.16,'sine');},cheer(){hiss(1.6,.2,1400,.5,.25);hiss(1.2,.1,2600,.8,.3);},aww(){hiss(.9,.09,500,.7,.2);}};

/* ================= renderer & scene ================= */
let renderer;
try{renderer=new T.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});}catch(e){$('#fail').hidden=false;return;}
renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene(),camera=new T.PerspectiveCamera(46,1,1,700);
let W=1,H=1;
const lin=c=>new T.Color(c).convertSRGBToLinear();

function matchEnd(){const won=S.you>S.them,T2=TEAMS[S.opp];if(won){confetti();sfx.cheer();S.cheer=3;}
  show(`<h1>${won?`You win <em>${S.you}–${S.them}</em>`:`${T2[0].n.split(' ').pop()} &amp; ${T2[1].n.split(' ').pop()} win <em>${S.them}–${S.you}</em>`}</h1><p>${won?'Try the next level up and see if the same calls hold. Then bring them to open play.':'Every lost point has a coach note. Change one habit and play it again.'}</p><p class="site">Every match matters, every point counts. <a href="${APP_HOME}">Book an MDP open play</a></p>
   <div class="row"><button class="big" id="b-re">Rematch</button><button class="big soft" id="b-home">Change levels</button></div>`,true);$('#b-re').onclick=()=>start('match');$('#b-home').onclick=home;}

/* ================= coach ================= */
function quickWhy(won,how){const last=[...S.log].reverse().find(l=>l.k==='hit');
  if(won)return {net:'They found the net.',out:'They hit it out.',doubleBounce:"They couldn't get to it.",serveFault:'Their serve missed.'}[how]||'Nice.';
  return {noCall:"The ball came to you and you didn't call a shot.",net:last?`Your ${last.shot} caught the net.`:'Into the net.',out:last?`Your ${last.shot} sailed out.`:'Out.',doubleBounce:"You didn't get to the ball.",serveFault:'The serve has to land past their kitchen, in the diagonal box.'}[how]||'';}
function coach(won,how,over){const hi=S.dupr>=3.5,T2=TEAMS[S.opp],lvl=S.opp.toFixed(1),hits=S.log.filter(l=>l.k==='hit'),last=hits[hits.length-1],me=S.ents.you,ps=[];
  const zn={base:'the baseline',trans:'the transition zone',kitchen:'the kitchen line'};
  const passed=hits.find(h=>h.zone==='kitchen'&&h.z>=SMASH_Z+.2&&h.type==='soft');
  if(how==='noCall')ps.push(hi?'No call. Indecision loses more points than bad shots. Have a default for each spot: drop from the back, dink cross at the line, put away anything high. Call it early, then adjust.':'You waited too long. Decide before the ball gets to you: soft from the back, soft at the net, hard only when the ball is high.');
  else if(how==='serveFault')ps.push('Serve deep, into the box diagonal from you. A short serve that lands in their kitchen is a fault.');
  else if(!won&&(how==='net'||how==='out')&&last){
    if(last.type==='smash'&&last.low)ps.push(hi?`You called smash on a ball at ${last.z.toFixed(1)} ft. You can only hit down on a ball that is above the net, about ${SMASH_Z} ft and up. Below that, dink or reset and wait.`:`That ball was too low to smash. Smash only when the ball is up high, above the net. If it is low, call dink.`);
    else if(last.type==='drive'&&last.z<2.4)ps.push(hi?`You drove a ball at ${last.z.toFixed(1)} ft. Anything below net height has to travel up before it comes down, which means net or long. Reset it and wait for a higher ball.`:`That ball was low. Hitting hard from below the net sends it into the net or long. Low ball, hit soft. High ball, hit hard.`);
    else if(last.type==='lob'&&last.zone==='base')ps.push(hi?'Baseline lobs are the lowest-percentage shot in the game. Long distance, tiny margin, and even a good one hands them an overhead.':'Lobs from the back of the court almost never work. Drop it into their kitchen instead.');
    else if(last.type==='soft'&&last.incoming>30)ps.push(hi?'Right call. Resetting a hard ball needs soft hands. Loosen the grip and let the paddle absorb it.':'Good call going soft against a hard ball. It just needs a lighter touch. Keep choosing it.');
    else if(last.type==='soft')ps.push(hi?`Right call from ${zn[last.zone]}. It just didn't land. That is reps, not strategy. Aim a foot higher over the net and let it fall in the kitchen.`:`That was the right call. It just missed. Keep choosing it. The touch comes with practice.`);
    else if(last.type==='drive'&&last.oppK&&last.zone!=='kitchen')ps.push(hi?'Driving into two set players at the line from the back is a low-percentage trade, and the miss shows it. Drop, then move up.':'They were both at the net, so the hard shot had nowhere to go. Soft into their kitchen, then walk in behind it.');
    else if(last.type==='smash')ps.push(hi?'Right call, missed execution. On a put-away, aim at the feet of the closer player. It is a bigger target than the corner.':'Smash was the right call on a high ball. It just missed. Aim at their feet next time.');
    else ps.push(hi?'Execution miss. The call was reasonable. Give yourself more net clearance.':'That one just missed. The call was fine.');}
  else if(!won&&how==='doubleBounce'){const L=S.landing||{x:10,y:40},lob=S.ball&&S.ball.lastType==='lob',dz=me.y>=31&&me.y<38;
    if(passed)ps.push(hi?`You had a ball at ${passed.z.toFixed(1)} ft at the kitchen line and dinked it. That was the one to put away. High ball at the line, call smash at the feet.`:`Earlier in the point you had a high ball at the net and hit it soft. High balls are your chance. Call smash.`);
    else if(lob)ps.push(hi?"Lobbed over you. Turn and run it down. Never backpedal. If it's on your partner's side, call the switch.":'They lobbed you. Turn around and run to where it lands.');
    else if(dz&&last&&last.type==='drive')ps.push(hi?'Your drive left you in the transition zone. Balls at your feet there are almost unplayable. Drop instead, and the extra time gets you all the way to the line.':'After your hard shot you were stuck in the middle of the court, the hardest place to play from. A soft shot gives you time to get all the way up.');
    else if(last&&last.type==='smash'&&last.low)ps.push(hi?`The smash on a ${last.z.toFixed(1)} ft ball came back at you. Below the net you are hitting up, and they counter it.`:'You smashed a low ball and it sat up for them. Smash only the high ones.');
    else if(Math.abs(L.x-me.x)>4)ps.push(hi?'The ball landed on your half and you were pulled wide. Shots down the middle keep you both in position.':'The ball landed on your side, but you were too far away to reach it.');
    else ps.push(hi?`${T2[0].n} and ${T2[1].n} hit a winner. Look at the shot before it: ${last?`your ${last.shot} from ${zn[last.zone]}${last.type==='soft'&&last.z>3?' came off a high contact and floated':''}`:'nothing to work with'}. At ${lvl}, a ball above the net gets punished every time, so keep the dinks lower.`:`They hit a great shot. ${last?`Your ${last.shot} before it was fine.`:''} Keep it low and you'll get most of those back.`);}
  else if(won){const bad=hits.find(h=>(h.type==='smash'&&h.low)||(h.type==='drive'&&h.z<2.4)||(h.type==='lob'&&h.zone==='base')||(h.type==='drive'&&h.oppK&&h.zone==='base'));
    if(bad)ps.push(hi?`You won it, but you got away with a ${bad.shot} from ${zn[bad.zone]}${bad.z<2.4?' on a low ball':''}. A ${lvl} punishes that most of the time. It just didn't today.`:`You won the point, but the ${bad.shot} from ${zn[bad.zone]} was a risky call. Against better players, soft into the kitchen is the safer play.`);
    else if(passed)ps.push(hi?`You won, but you let a ${passed.z.toFixed(1)} ft ball go with a dink. Put those away and the point ends sooner.`:'You won. One note: you had a high ball at the net and hit it soft. Next time call smash.');
    else ps.push(hi?'Clean point. High-percentage calls all the way through.':"Great point. Soft when low, hard when high, and you got to the kitchen. That's the recipe.");}
  if(!ps.length)ps.push('Nothing to fix on that one.');
  const logHtml=hits.map((h,i)=>`<div><b>${i+1}. ${cap(h.shot)}</b> from ${zn[h.zone]}, contact at ${h.z.toFixed(1)} ft${h.oppK?', both opponents at the line':''}</div>`).join('')||'<div>No shots from you this point.</div>';
  show(`<h2>Coach</h2><div class="coach">${ps.map(p=>`<p>${p}</p>`).join('')}</div><div class="log">${logHtml}</div>
   <div class="row"><button class="big" id="b-next">${over?'Final score':'Next point'}</button><button class="big soft" id="b-home">Quit</button></div>`,true);nextBtn(over);}

/* ================= loop ================= */
window.__ks={S,callShot,makeShot,endPoint,camera,parseVoice};
function frame(now){const raw=Math.min(.25,Math.max(0,(now-(S.last||now))/1000)),dt=Math.min(.033,raw);S.last=now;const t=now/1000;
  if(S.stop>0)S.stop-=dt;else if(S.mode&&S.ball)for(let i=0;i<(window.__ks.speed||1);i++)step(dt);
  for(const[k,e]of Object.entries(S.ents))updateChar(k,e,dt,t);
  updateBall(dt,t);updateFx(dt,t);updateCrowd(dt,t);updateFlashes(dt);updateCamera(raw,t);
  renderer.render(scene,camera);updateLabels(t);requestAnimationFrame(frame);}
window.addEventListener('resize',fit);fit();
function boot(d){d=d||{};if(LEVELS.includes(d.dupr))S.dupr=d.dupr;if(LEVELS.includes(d.opp))S.opp=d.opp;home();
  if(d.mode){S.you=d.you|0;S.them=d.them|0;S.pts=d.pts|0;S.serving=d.serving!==false;start(d.mode,true);}
  requestAnimationFrame(frame);}
boot({});
};
window.__loadThree();
</script>
